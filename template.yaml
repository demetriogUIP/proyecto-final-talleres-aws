AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Proyecto Final - Gestión de Talleres de Formación Profesional.
  Infraestructura serverless desarrollada con AWS SAM.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256

  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'http://localhost:5173'"

    Auth:
      DefaultAuthorizer: CognitoAuthorizer
      AddDefaultAuthorizerToCorsPreflight: false
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !GetAtt WorkshopsUserPool.Arn

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

Resources:

  WorkshopsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub workshops-${Environment}
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

      Tags:
        - Key: Project
          Value: Workshops
        - Key: Environment
          Value: !Ref Environment

  WorkshopsEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub workshops-events-${Environment}

  WorkshopsNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub workshops-notifications-${Environment}

  WorkshopsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/workshops/
      Handler: app.lambda_handler

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkshopsTable

      Environment:
        Variables:
          TABLE_NAME: !Ref WorkshopsTable

      Events:
        GetWorkshops:
          Type: Api
          Properties:
            Path: /workshops
            Method: get

        GetWorkshopById:
          Type: Api
          Properties:
            Path: /workshops/{id}
            Method: get

        CreateWorkshop:
          Type: Api
          Properties:
            Path: /workshops
            Method: post

        UpdateWorkshop:
          Type: Api
          Properties:
            Path: /workshops/{id}
            Method: put

        DeleteWorkshop:
          Type: Api
          Properties:
            Path: /workshops/{id}
            Method: delete

  RegistrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/registrations/
      Handler: app.lambda_handler

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkshopsTable

        - Statement:
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !GetAtt WorkshopsEventBus.Arn

      Environment:
        Variables:
          TABLE_NAME: !Ref WorkshopsTable
          EVENT_BUS_NAME: !Ref WorkshopsEventBus

      Events:
        RegisterWorkshop:
          Type: Api
          Properties:
            Path: /workshops/{id}/register
            Method: post

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/notifications/
      Handler: app.lambda_handler

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref WorkshopsNotificationTopic

      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref WorkshopsNotificationTopic

  ReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/reminders/
      Handler: app.lambda_handler

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref WorkshopsTable

        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref WorkshopsNotificationTopic

      Environment:
        Variables:
          TABLE_NAME: !Ref WorkshopsTable
          SNS_TOPIC_ARN: !Ref WorkshopsNotificationTopic

  ReminderSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub workshops-reminder-scheduler-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - scheduler.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: InvokeReminderFunction
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt ReminderFunction.Arn

  ReminderSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub workshops-reminder-schedule-${Environment}
      Description: Ejecución periódica de la función de recordatorios de talleres

      FlexibleTimeWindow:
        Mode: "OFF"

      ScheduleExpression: "rate(1 hour)"

      State: ENABLED

      Target:
        Arn: !GetAtt ReminderFunction.Arn
        RoleArn: !GetAtt ReminderSchedulerRole.Arn

        Input: '{}'                      

  WorkshopsRegistrationRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub workshops-registration-${Environment}
      EventBusName: !Ref WorkshopsEventBus

      EventPattern:
        source:
          - workshops.registration
        detail-type:
          - STUDENT_REGISTERED

      Targets:
        - Arn: !GetAtt NotificationFunction.Arn
          Id: NotificationFunctionTarget

  NotificationFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NotificationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WorkshopsRegistrationRule.Arn

  WorkshopsUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub workshops-users-${Environment}

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  WorkshopsUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref WorkshopsUserPool
      ClientName: !Sub workshops-client-${Environment}
      GenerateSecret: false

      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

Outputs:

  WorkshopsTableName:
    Description: Nombre de la tabla DynamoDB de talleres
    Value: !Ref WorkshopsTable

  WorkshopsTableArn:
    Description: ARN de la tabla DynamoDB de talleres
    Value: !GetAtt WorkshopsTable.Arn

  WorkshopsFunctionArn:
    Description: ARN de la función Lambda de talleres
    Value: !GetAtt WorkshopsFunction.Arn

  RegistrationFunctionArn:
    Description: ARN de la función Lambda de registros
    Value: !GetAtt RegistrationFunction.Arn

  WorkshopsEventBusName:
    Description: Nombre del Event Bus de talleres
    Value: !Ref WorkshopsEventBus

  WorkshopsEventBusArn:
    Description: ARN del Event Bus de talleres
    Value: !GetAtt WorkshopsEventBus.Arn

  WorkshopsNotificationTopicArn:
    Description: ARN del SNS Topic de notificaciones
    Value: !Ref WorkshopsNotificationTopic

  NotificationFunctionArn:
    Description: ARN de la función Lambda de notificaciones
    Value: !GetAtt NotificationFunction.Arn

  ReminderFunctionArn:
    Description: ARN de la función Lambda de recordatorios
    Value: !GetAtt ReminderFunction.Arn

  ReminderScheduleArn:
    Description: ARN del EventBridge Scheduler de recordatorios
    Value: !GetAtt ReminderSchedule.Arn

  WorkshopsUserPoolId:
    Description: ID del Cognito User Pool
    Value: !Ref WorkshopsUserPool

  WorkshopsUserPoolClientId:
    Description: ID del App Client de Cognito
    Value: !Ref WorkshopsUserPoolClient

  WorkshopsApiUrl:
    Description: URL base de la API REST de talleres
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
