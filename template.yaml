AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Proyecto Final - Gestión de Talleres de Formación Profesional.
  Infraestructura serverless desarrollada con AWS SAM.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

Resources:

  WorkshopsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub workshops-${Environment}
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

      Tags:
        - Key: Project
          Value: Workshops
        - Key: Environment
          Value: !Ref Environment

  WorkshopsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/workshops/
      Handler: app.lambda_handler

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkshopsTable

      Environment:
        Variables:
          TABLE_NAME: !Ref WorkshopsTable

      Events:
        GetWorkshops:
          Type: Api
          Properties:
            Path: /workshops
            Method: get

        GetWorkshopById:
          Type: Api
          Properties:
            Path: /workshops/{id}
            Method: get

        CreateWorkshop:
          Type: Api
          Properties:
            Path: /workshops
            Method: post

        UpdateWorkshop:
          Type: Api
          Properties:
            Path: /workshops/{id}
            Method: put

        DeleteWorkshop:
          Type: Api
          Properties:
            Path: /workshops/{id}
            Method: delete

  WorkshopsUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub workshops-users-${Environment}

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

Outputs:

  WorkshopsTableName:
    Description: Nombre de la tabla DynamoDB de talleres
    Value: !Ref WorkshopsTable

  WorkshopsTableArn:
    Description: ARN de la tabla DynamoDB de talleres
    Value: !GetAtt WorkshopsTable.Arn

  WorkshopsFunctionArn:
    Description: ARN de la función Lambda de talleres
    Value: !GetAtt WorkshopsFunction.Arn

  WorkshopsUserPoolId:
    Description: ID del Cognito User Pool
    Value: !Ref WorkshopsUserPool

  WorkshopsApiUrl:
    Description: URL de la API REST de talleres
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/workshops"
